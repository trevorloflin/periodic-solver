<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Encryption Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Enter the cipher text here, and any known plaintext immediately below (use spaces to line them up):</p>
    <div class="ui-row"><input id="ciphertext" class="code-text"></input></div>
    <div class="ui-row"><input id="plaintext" class="code-text"></input></div>
    <div class="ui-row"><button id="solve-btn" class="action">Solve</button></div>
    <div class="ui-row" id="results"></div>

    <script src="solver.js"></script>
</body>
</html>
